[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoos2"
version = "0.1.0"
description = "Pure-Python MOOS-IvP application framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Raymond Turrisi", email = "rturrisi@mit.edu"},
]
keywords = ["moos", "moos-ivp", "robotics", "auv", "marine", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
Homepage = "https://github.com/raymondturrisi/pymoos2"
Repository = "https://github.com/raymondturrisi/pymoos2"

[project.scripts]
pymoos2 = "pymoos2.__main__:main"

[tool.setuptools.packages.find]
include = ["pymoos2*"]

[tool.setuptools.package-data]
pymoos2 = ["templates/**/*"]
