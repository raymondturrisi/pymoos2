name: tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - {os: macos-latest, python: "3.8"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", allow-prereleases: true}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - run: python -m pip install dist/*.whl pytest numpy
      - name: test the installed wheel, not the checkout
        run: |
          mkdir ../t && cp -r tests ../t/
          cd ../t && PYTHONDONTWRITEBYTECODE=1 python -m pytest tests -q -p no:cacheprovider
